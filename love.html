<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código de Amor</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0114;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            color: #ffffff;
        }
        .container {
            text-align: center;
            position: relative;
            z-index: 10;
            padding: 20px;
        }
        .heart {
            background-color: #ff2a5f;
            display: inline-block;
            height: 120px;
            margin: 0 10px;
            position: relative;
            transform: rotate(-45deg);
            width: 120px;
            animation: pulse 1.2s infinite;
            box-shadow: 0 0 40px #ff2a5f;
        }
        .heart:before, .heart:after {
            content: "";
            background-color: #ff2a5f;
            border-radius: 50%;
            height: 120px;
            position: absolute;
            width: 120px;
        }
        .heart:before { top: -60px; left: 0; }
        .heart:after { top: 0; left: 60px; }
        
        @keyframes pulse {
            0% { transform: scale(1) rotate(-45deg); box-shadow: 0 0 20px #ff2a5f; }
            50% { transform: scale(1.15) rotate(-45deg); box-shadow: 0 0 60px #ff2a5f; }
            100% { transform: scale(1) rotate(-45deg); box-shadow: 0 0 20px #ff2a5f; }
        }
        h1 {
            margin-top: 50px;
            font-size: 3em;
            font-weight: 300;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 42, 95, 0.7);
        }
        p {
            font-size: 1.2em;
            color: #cbbad6;
            margin: 15px 0 30px 0;
            max-width: 500px;
            line-height: 1.6;
        }
        .btn-surprise {
            padding: 14px 30px;
            background: transparent;
            border: 2px solid #ff2a5f;
            color: #ff2a5f;
            font-size: 1.1em;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            position: relative;
            z-index: 100;
        }
        .btn-surprise:hover {
            background: #ff2a5f;
            color: #ffffff;
            box-shadow: 0 0 25px #ff2a5f;
            transform: translateY(-2px);
        }
        
        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            user-select: none;
            opacity: 0;
            transition: transform var(--t-duration) linear, opacity var(--t-duration) linear;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart"></div>
        <h1>Te Amo</h1>
        <p>Eres el código que compila perfectamente en mi vida y el algoritmo que hace latir mi corazón.</p>
        <button class="btn-surprise" onclick="crearCorazones()">Haz clic aquí</button>
    </div>

    <script>
        function crearCorazones() {
            const corazones = ['❤️', '💖', '💝', '💕', '✨', '🌸', '💘'];
            
            for(let i = 0; i < 35; i++) {
                setTimeout(() => {
                    const particula = document.createElement('div');
                    particula.classList.add('particle');
                    particula.innerHTML = corazones[Math.floor(Math.random() * corazones.length)];
                    
                    const inicioX = Math.random() * 100;
                    const inicioY = window.innerHeight + 50;
                    const duracion = Math.random() * 2000 + 2500;
                    const tamaño = Math.random() * 15 + 15;
                    const desviacion = Math.random() * 200 - 100;
                    
                    particula.style.left = inicioX + 'vw';
                    particula.style.top = inicioY + 'px';
                    particula.style.fontSize = tamaño + 'px';
                    particula.style.setProperty('--t-duration', duracion + 'ms');
                    
                    document.body.appendChild(particula);
                    
                    window.getComputedStyle(particula).opacity;
                    
                    particula.style.opacity = '1';
                    particula.style.transform = `translate(${desviacion}px, -${window.innerHeight + 150}px) scale(${Math.random() * 0.5 + 0.8})`;
                    
                    setTimeout(() => {
                        particula.style.opacity = '0';
                    }, duracion - 500);

                    setTimeout(() => {
                        particula.remove();
                    }, duracion);
                    
                }, i * 60);
            }
        }
    </script>
</body>
</html>
